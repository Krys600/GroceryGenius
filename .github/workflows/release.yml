name: release

# Builds a signed release APK and publishes it as a GitHub release.
# Runs when a tag like v0.2.0 is pushed, or manually with the tag to create.
#
# Signing uses these repository secrets:
#   RELEASE_KEYSTORE_BASE64    the keystore file, base64 encoded (base64 -w 0 release.keystore)
#   RELEASE_KEYSTORE_PASSWORD  the keystore password
#   RELEASE_KEY_ALIAS          the alias of the signing key
#   RELEASE_KEY_PASSWORD       the password of the signing key
# Without them, the APK is signed with a temporary debug key, so it can't be updated by later releases.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of the release to create, e.g. v0.2.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Decode signing keystore
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 is not set, the APK is signed with a temporary debug key"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit test
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare release files
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/GroceryGenius-$RELEASE_TAG.apk"
          cd dist && sha256sum *.apk > SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Grocery Genius ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          body: ${{ steps.keystore.outputs.signed == 'false' && '> **Note:** this APK is signed with a temporary debug key, so it cannot be installed as an update of this or later releases.' || '' }}
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt

      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
